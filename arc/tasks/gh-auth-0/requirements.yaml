      children: []
    - id: REQ-1-1-2
      name: Sign In with an Existing Account
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: 'This feature builds on the persisted objects, opened pages, or
        authenticated-session context provided by REQ-1-1-1 (Register a New GitHub
        Account); it must reuse that context and keep pages and data consistent after
        the context changes. The sign-in page is the form on the account-access page
        containing “Username or email”, “Password”, and “Sign in”. A “session” is
        the current-browser login record saved after successful account authentication,
        represented in the frontend by the upper-right account menu and access to
        protected pages. The visitor enters a username or email and a password and
        submits the form. The system looks up the account and validates its credentials
        and availability status; if authentication fails due to an unknown username/email,
        incorrect password, or unavailable account, the system displays exactly the
        same generic failure message “Invalid credentials”, does not disclose whether
        the account exists or which credential was wrong, and does not create a session.
        After successful authentication, the system stores a session with a unique
        session identifier, account identifier, and active status, then redirects
        to the workspace accessible to that user; the session remains valid after
        refreshing or reopening the workspace, and subsequent protected organization,
        repository, and work-item requests must use this session to determine the
        current user.


        Screenshot reference:

        ![image](reference/github-sign-in.png)'
      scenarios:
      - name: 'REQ-1-1-2: Sign In with an Existing Account - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`. The visitor enters the account-access
            page from the home page; a verified and available account exists, and
            the visitor has the account''s username or verified email and current
            password. Seed values: account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`.'
        - keyword: WHEN
          content: 'The visitor enters the username or verified email in “Username
            or email”, enters the correct password in “Password”, and clicks “Sign
            in”. Seed values: account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`.'
        - keyword: THEN
          content: 'The system enters the user''s workspace, the account menu displays
            the username, and the user can access organizations, repositories, and
            work items they are authorized to view. An unknown account, incorrect
            password, or unavailable account all produce exactly the same generic
            failure message, remain on the sign-in page, and do not display the account
            menu. Seed values: account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`.'
        - keyword: THEN
          content: 'After successful sign-in, refreshing the workspace or directly
            reopening the previously accessible protected page still shows the signed-in
            user; after failed sign-in, refreshing or opening the visible protected
            page still requires authentication. Seed values: account `alice-dev`,
            email `alice.dev@example.test`, password `Valid-password-123!`.'
