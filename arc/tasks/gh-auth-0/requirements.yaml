    - id: REQ-1-1-3
      name: Recover Account Access Through a Verified Email
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: 'The password-recovery page is opened by the link “Forgot password”
        on the sign-in page; the fixed code is displayed as a distinct visible text
        value exactly “123456”, not only embedded inside a longer instruction. “Email”,
        “Verification code”, “New password”, and “Confirm password” are associated
        field labels; “Send reset link” and “Reset password” are buttons. The recovery
        scenario uses a newly registered account, an unknown email, a compliant replacement
        such as “Replacement-password-456!”, and invalid code “000000”; failure leaves
        the registered account able to sign in with its old email/password. In this
        flow, the local system does not send email, generate a copyable reset link,
        or call an external verification-code service. After the visitor enters an
        address in the Email field and clicks “Send reset link”, the page directly
        switches to the next step of the same recovery flow, displays the fixed verification-code
        text “123456” for local demonstration only, and shows visibly labeled Verification
        code, New password, Confirm password fields and a “Reset password” button;
        the page must not require access to email. To prevent disclosure through the
        page of whether an account exists, both registered and unknown email addresses
        enter the same next step and display the same fixed verification code. The
        system atomically updates the credentials of that account only when the recovery
        context is associated with a registered email, the Verification code is character-for-character
        equal to “123456”, the new password complies with the password rules in REQ-1-1-1,
        and Confirm password matches it. If the verification code is wrong, the email
        is unknown, the password is noncompliant, or the confirmation does not match,
        the page explains the reason beside the corresponding field and does not modify
        any account; an incorrect verification code displays “Verification code is
        invalid”. After successful submission, the page directly displays “Password
        updated” and does not produce any email or link. This local verification code
        has no email-delivery, expiration, or one-time-link semantics. Password fields
        must not echo entered values.


        Screenshot reference:

        ![image](reference/github-password-reset.png) ![image](reference/github-password-reset-1.png)'
      scenarios:
      - name: 'REQ-1-1-3: Recover Account Access Through a Verified Email - Scenario
          1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`. The visitor opens “Forgot password” from
            the account-access page; one registered account and its email exist, together
            with another email that corresponds to no account for comparison. Seed
            values: account `alice-dev`, email `alice.dev@example.test`, password
            `Valid-password-123!`.'
        - keyword: WHEN
          content: 'The visitor submits the registered email and the unknown email
            separately; in each directly opened next step, the visitor enters the
            fixed verification code “123456”, a new password compliant with REQ-1-1-1,
            and the same confirmation password, then submits. Seed values: account
            `alice-dev`, email `alice.dev@example.test`, password `Valid-password-123!`.'
        - keyword: THEN
          content: 'Both requests directly display the fixed verification code “123456”
            and the password-reset form, do not indicate whether the email exists,
            and do not require access to email or a link. Only the correct-code submission
            for the registered email updates that account''s password and displays
            a success result; an unknown email, incorrect verification code, noncompliant
            password, or mismatched confirmation displays the reason and does not
            modify any account. Seed values: account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`.'
        - keyword: THEN
          content: 'After success, sign-in with the old password fails and sign-in
            with the new password succeeds; after failure, the old password still
            works and the candidate new password does not. Refreshing the reset page
            must not generate an email, link, or second account. Seed values: account
            `alice-dev`, email `alice.dev@example.test`, password `Valid-password-123!`.'
      - name: 'REQ-1-1-3: Recover Account Access Through a Verified Email - Scenario
          2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`. The visitor starts at the application
            home page in a fresh unauthenticated browser session. Seed values: account
            `alice-dev`, email `alice.dev@example.test`, password `Valid-password-123!`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the recover account access through a
            verified email workflow. Seed values: account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and
            status for the recover account access through a verified email workflow.
            Seed values: account `alice-dev`, email `alice.dev@example.test`, password
            `Valid-password-123!`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: account `alice-dev`, email `alice.dev@example.test`,
            password `Valid-password-123!`.'
