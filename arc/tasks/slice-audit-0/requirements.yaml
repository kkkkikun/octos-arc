id: ROOT
name: Core Requirements for an Online Spreadsheet Data Workspace
type: FOLDER
dependencies: []
description: 'A streamlined online spreadsheet application with an interface modeled
  after Google Sheets, covering workbook and worksheet management, spreadsheet data
  editing, formula calculation, sorting and filtering, data validation, and basic
  pivot analysis. Sharing and collaboration, version-history restoration, advanced
  visual styling, charts, macros, real-time collaborative cursors, and integrations
  with external office suites are outside the core scope.

  '
children:
- id: REQ-1
  name: Workbook Access and Lifecycle
  type: FOLDER
  dependencies: []
  description: 'Supports viewing, opening, creating, renaming, importing, and exporting
    workbooks within the application. The home page is the entry point for workbooks;
    successful open, create, and import operations all enter the same editor page,
    and subsequent operations may modify only the currently opened workbook. After
    a workbook is opened, created, or imported, the editor state shown in the browser
    must be a stable workbook state: visiting or refreshing that exact workbook state
    must open the same workbook rather than another workbook or a temporary blank
    page, and successful workbook modifications must remain available through that
    visible workbook state. After returning to the home page or reopening, the workbook
    name, last-updated time, worksheet order, and last active worksheet remain consistent.
    Worksheet tabs on the same editor page use the ARIA tab role, with the active
    tab indicated by aria-selected="true"; the active worksheet grid uses the ARIA
    grid role, has the accessible name "Worksheet grid", and exposes aria-multiselectable="true".
    Grid cells use the ARIA gridcell role with their cell coordinates as accessible
    names (for example, A1); the current cell and every cell within the currently
    selected rectangular region expose aria-selected="true", while cells outside the
    region expose aria-selected="false".

    '
  children:
  - id: REQ-1-2
    name: Workbook Creation and Naming
    type: FOLDER
    dependencies: []
    description: 'Supports creating a blank workbook and changing the workbook name;
      both operations are initiated from visible workbook state points on the home
      page or editor page. After success, the workbook record on the home page and
      the editor title are updated consistently and remain so after refresh or reopening.

      '
    children:
    - id: REQ-1-2-1
      name: Create a Blank Workbook
      type: ATOMIC
      dependencies: []
      description: 'Users create a blank workbook from the workbook home page. The
        home page provides a button with the accessible name "New blank workbook";
        clicking it opens the creation page, whose submit button is named "Create".
        After creation succeeds, the editor opens and shows only a blank worksheet
        named Sheet1, with Sheet1 active and A1 selected; refreshing or returning
        to the home page and reopening produces the same state. If creation fails,
        an error is displayed, the user remains in a retryable state, and no incomplete
        workbook record may appear on the home page.


        Page reference:

        ![image](reference/create-workbook.png)

        '
      scenarios:
      - name: REQ-1-2-1 -the requested workflow,the requested workflow Sheet1 the
          requested workflow A1 the requested workflow
        steps:
        - keyword: GIVEN
          content: The visitor starts at the application home page in a fresh unauthenticated
            browser session. The evaluation seed contains the seeded workbook `Q3
            Sales`, worksheet `Sheet1`, and cell A1 value `Region`.
        - keyword: WHEN
          content: The user opens the workbook home page, clicks the visible `Q3 Sales`
            workbook entry, and the requested workflow,the requested workflow sheet1
            the requested workflow a1 the requested workflow with concrete values
            `East`, `1200`, `North`, and `800`. Every value is entered through a visible,
            labelled control; no implementation-specific navigation, API, database
            id, or internal implementation detail is assumed.
        - keyword: THEN
          content: The application exposes the observable result for "the requested
            workflow,the requested workflow Sheet1 the requested workflow A1 the requested
            workflow" using the same seeded names and values (the seeded workbook
            `Q3 Sales`, worksheet `Sheet1`, and cell A1 value `Region`); validation
            or permission failures are shown beside the named control and do not create
            a partial record.
        - keyword: THEN
          content: After the user refreshes the page or reopens the visible destination
            from the application entry point, the successful result and workbook `Q3
            Sales`, worksheet `Sheet1`, cell `A1=Region` remain persisted; on failure,
            the original seeded state remains unchanged.
      children: []
- id: REQ-2
  name: Worksheets and Table Structure
  type: FOLDER
  dependencies: []
  description: 'Supports managing multiple worksheets within one workbook and adjusting
    row and column structure. Each worksheet’s name, order, grid values, formulas,
    validation rules, filter views, and pivot table results are independent; switching
    worksheets or reopening the workbook must not display data from another worksheet.

    Page reference:

    ![image](reference/worksheet-overview.png)

    '
  children:
  - id: REQ-2-1
    name: Worksheet Lifecycle
    type: FOLDER
    dependencies: []
    description: 'Supports creating, switching, renaming, and deleting worksheets
      while ensuring that each worksheet’s grid, formulas, validation behavior, filter
      views, pivot-table field selections, and results remain independent and persist
      after reopening. The worksheet tab bar displays worksheet order and active state
      after the most recent successful operation and provides a button with the accessible
      name "Add worksheet". Each worksheet tab provides a button with the accessible
      name "Worksheet options for <worksheet name>"; clicking it opens a menu whose
      commands use the ARIA menuitem role.


      Page reference:

      ![image](reference/worksheet-lifecycle.png)

      '
    children:
    - id: REQ-2-1-3
      name: Rename a Worksheet
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: 'Users change a worksheet name from the worksheet tab menu. The
        "Rename" menu item opens a dialog named "Rename worksheet", containing a text
        box labeled "Worksheet name" prefilled with the current name and a "Save"
        button. After trimming leading and trailing spaces, the new name must not
        be empty and must be unique within the same workbook; an empty name displays
        "Worksheet name cannot be empty", and a duplicate name displays "Worksheet
        name already exists". After a successful save, the tab displays the new name;
        if saving fails, the name is duplicate, or the name is empty, an error is
        displayed and the original name remains. Refreshing or reopening shows the
        most recently saved successful name.

        '
      scenarios:
      - name: REQ-2-1-3 -the requested workflow,the requested workflow
        steps:
        - keyword: GIVEN
          content: The visitor starts at the application home page in a fresh unauthenticated
            browser session. The evaluation seed contains the seeded workbook `Q3
            Sales` with `Sheet1` and `Sheet2`, rows `East/1200` and `North/800`.
        - keyword: WHEN
          content: The user opens the workbook home page, clicks the visible `Q3 Sales`
            workbook entry, and the requested workflow,the requested workflow with
            concrete values `East`, `1200`, `North`, and `800`. Every value is entered
            through a visible, labelled control; no implementation-specific navigation,
            API, database id, or internal implementation detail is assumed.
        - keyword: THEN
          content: The application exposes the observable result for "the requested
            workflow,the requested workflow" using the same seeded names and values
            (the seeded workbook `Q3 Sales` with `Sheet1` and `Sheet2`, rows `East/1200`
            and `North/800`); validation or permission failures are shown beside the
            named control and do not create a partial record.
        - keyword: THEN
          content: After the user refreshes the page or reopens the visible destination
            from the application entry point, the successful result and workbook `Q3
            Sales`, worksheets `Sheet1` and `Sheet2`, rows `East/1200` and `North/800`
            remain persisted; on failure, the original seeded state remains unchanged.
      - name: REQ-2-1-3 -the requested workflow,the requested workflow
