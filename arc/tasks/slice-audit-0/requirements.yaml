- id: REQ-4
  name: Formula Calculation
  type: FOLDER
  dependencies: []
  description: 'Supports basic formula calculation, relative and absolute references,
    dependency recalculation, and error handling within the current active worksheet.
    The grid displays formula results or errors, while the formula bar displays the
    expression submitted by the user; copy, paste, row/column changes, and source-value
    edits follow the same reference-adjustment and recalculation rules. After reopening
    the workbook, formula expressions and correct results calculated from the current
    source values remain visible.

    '
  children:
  - id: REQ-4-1
    name: Formula Input and Functions
    type: FOLDER
    description: 'Supports entering basic expressions and aggregate functions through
      the grid and "Formula bar" from REQ-3-1-1 and copying formulas through REQ-3-2-1.
      The formula bar always displays the original formula, the grid displays results
      consistent with the current source data, and both persist after refresh.

      '
    dependencies: []
    children:
    - id: REQ-4-1-1
      name: Calculate Basic Expressions and Aggregate Functions
      type: ATOMIC
      description: 'Users enter formulas beginning with an equals sign through the
        grid or formula bar in REQ-3-1-1. Formulas must support at least numeric constants,
        parentheses, addition, subtraction, multiplication, division, A1-style references
        within the same worksheet, and SUM, AVERAGE, COUNT, MIN, and MAX over contiguous
        ranges; cross-worksheet references are not required. The grid displays results
        calculated from the current source data, and when a formula cell is selected
        the formula bar displays the original expression entered by the user; both
        persist after refresh. Function names are case-insensitive; aggregate functions
        ignore empty cells, COUNT counts only numeric cells, and SUM/AVERAGE/MIN/MAX
        use only numeric cells and do not treat blanks as zero.

        Page reference:

        ![image](reference/basic-formulas.png)

        '
      dependencies:
      - REQ-3-1-1
      scenarios:
      - name: REQ-4-1-1 -the requested workflow,the requested workflow
        steps:
        - keyword: GIVEN
          content: The visitor starts at the application home page in a fresh unauthenticated
            browser session. The evaluation seed contains the seeded workbook `Q3
            Sales`, cells `A1=2`, `B1=3`, and formulas `=A1+B1` and `=C1*2`.
        - keyword: WHEN
          content: The user opens the workbook home page, clicks the visible `Q3 Sales`
            workbook entry, and the requested workflow,the requested workflow with
            concrete values `East`, `1200`, `North`, and `800`. Every value is entered
            through a visible, labelled control; no implementation-specific navigation,
            API, database id, or internal implementation detail is assumed.
        - keyword: THEN
          content: The application exposes the observable result for "the requested
            workflow,the requested workflow" using the same seeded names and values
            (the seeded workbook `Q3 Sales`, cells `A1=2`, `B1=3`, and formulas `=A1+B1`
            and `=C1*2`); validation or permission failures are shown beside the named
            control and do not create a partial record.
        - keyword: THEN
