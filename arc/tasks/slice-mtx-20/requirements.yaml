    - id: REQ-3-1-3
      name: Select a Rectangular Cell Range
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: 'Users can click to select a single cell or drag from one corner of a rectangular region
        to the diagonally opposite cell to select a contiguous rectangle. The active worksheet must visibly
        indicate the complete selection; the grid exposes aria-multiselectable="true"; every gridcell
        inside the rectangle exposes aria-selected="true", while every gridcell outside it exposes aria-selected="false".
        Subsequent range operations use exactly this rectangle and must not implicitly expand to adjacent
        existing data. Selecting another cell or range replaces the previous selection and updates the
        ARIA state accordingly. Each worksheet must persist the complete rectangle from its most recent
        successful selection, not just its top-left corner: after refreshing or reopening the workbook
        and returning to that active worksheet, aria-selected states inside and outside the rectangle
        must exactly match the saved state; switching to another worksheet must not overwrite the original
        worksheet’s selection.

        '
