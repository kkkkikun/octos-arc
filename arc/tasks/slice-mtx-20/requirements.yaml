    description: 'Supports transferring data between ranges in the current active worksheet and using
      undo and redo to restore grid values, formulas, rule ranges, and row/column structure. The visible
      state after each undo or redo persists after refresh.

      '
    children:
    - id: REQ-3-2-1
      name: Copy, Cut, and Paste Cell Ranges
      type: ATOMIC
      dependencies:
      - REQ-3-1-1
      - REQ-3-1-3
      description: 'Users select a rectangular range by dragging from one corner to another in the current
        active worksheet, then copy or cut it and select a target location to paste; only operations within
        the same worksheet are supported. After copy, the source range remains unchanged; after cut, the
        source range is cleared only after the target range has been displayed completely. Values and
        formulas preserve their two-dimensional layout; when formulas are copied, relative references
        adjust according to the target offset while absolute references remain unchanged, and the formula
        bar displays the adjusted original formula. The source range, target range, and affected formulas
        must either all update and persist after refresh or all remain in their original state; when a
        target 0-to-100 numeric validation rule rejects the operation, the page displays "Please enter
        a number from 0 to 100". Cells outside these ranges must not change.


