    - id: REQ-3-2-2
      name: Undo and Redo Recent Operations
      type: ATOMIC
      dependencies:
      - REQ-2-2-1
      - REQ-2-2-2
      - REQ-3-1-1
      - REQ-3-1-2
      - REQ-3-2-1
      description: 'Users can undo recent cell edits, bulk pastes, range moves, and row/column structure
        changes in the current workbook session. The toolbar provides buttons with the accessible names
        "Undo" and "Redo"; Ctrl+Z and Ctrl+Y perform the same operations. Undo restores the grid values,
        original formulas, row/column structure, rule ranges, pivot-result validity, and calculation results
        from before the operation; consecutive undo operations restore changes in reverse order, and redo
        reapplies the complete operation that was just undone. Undo in one workbook must not modify another
        workbook. The state after each undo or redo persists after refresh; the history itself only needs
        to exist within the current session and may be empty after reopening. If a new modification is
        made after an undo, the "Redo" button becomes disabled and Ctrl+Y cannot restore the old branch.

        '
      scenarios:
      - name: REQ-3-2-2 -the requested workflow,the requested workflow
        steps:
        - keyword: GIVEN
          content: The visitor starts at the application home page in a fresh unauthenticated browser
            session. The evaluation seed contains the seeded workbook `Q3 Sales`, range `A1:B2` containing
