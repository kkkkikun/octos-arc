      description: 'Users paste text containing tab-separated columns and newline-separated rows into
        a starting cell in the current active worksheet. The system applies the entire rectangle, preserves
        empty fields, and overwrites only the target rectangle; formulas within the target are replaced
        by the new content and related formulas display recalculated results. The full paste either updates
        every cell in the rectangle and persists after refresh, or displays an error while all target
        cells retain their original values; when a 0-to-100 numeric validation rule rejects the paste,
        that error is "Please enter a number from 0 to 100". Silently dropping only some values is not
        allowed. The grid context menu provides a command using the ARIA menuitem role with the accessible
        name "Paste", and Ctrl+V pastes the same external clipboard content.

