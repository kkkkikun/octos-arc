- id: REQ-1-3-1
  name: Import CSV to Create a Workbook
  type: ATOMIC
  dependencies: []
  description: 'Users start an import by clicking the "Import CSV" button on the workbook home page. A
    dialog named "Import CSV" provides a file control labeled "CSV file" and a "Confirm import" button.
    The system parses data in the original row and column order, preserves empty fields, supports UTF-8
    Chinese text, English text, and numeric text, and correctly handles commas enclosed in double quotes,
    escaped pairs of double quotes, and line breaks within fields; a field that begins with a double quote
    but has no closing double quote is invalid CSV and must be rejected with "Invalid CSV file format.
    Import failed." After a successful import, a new workbook is created whose name is the file name with
    its final .csv extension removed, and Sheet1 opens with the complete CSV rows, columns, and original
    text; the first row remains ordinary data. After refresh or reopening, grid content and row/column
    order remain unchanged. If parsing or import fails, no workbook link with that name may appear on
    the home page, and no partial import result may be displayed or retained.

