- id: REQ-5-1-2
  name: Filter Rows by Value or Condition
  type: ATOMIC
  dependencies:
  - REQ-1-3-2
  - REQ-3-1-3
  description: 'Users create a filter for a data region with headers in the current active worksheet through
    "Create filter" in the "Data" menu. Each header provides a button with the accessible name "Filter
    <header text>"; the dialog with the same name supports selecting specific values and condition options
    named "Text contains", "Greater than", "Before", "Is empty", and "Is not empty". The value-filter
    dialog provides "Clear selection", checkboxes generated from distinct source values, and "Apply";
    each checkbox uses the displayed source value as its accessible name. The condition dialog provides
    a combo box labeled "Condition", a text box labeled "Value", and "Apply". "Text contains", "Greater
    than", and "Before" use the "Value" text box; "Is empty" and "Is not empty" require no value. Conditions
    on different columns are combined with AND; nonmatching rows are hidden only and are neither deleted
    nor reordered. After refresh or reopening, the same rows remain visible. CSV export and pivot summarization
    still include hidden rows within the filtered range. "Clear filter" restores all source records in
    their original order and with their original values; after refresh all remain visible, while formula
    and validation behavior are unchanged.

    '
