    "Export CSV" on the workbook editor toolbar. Clicking it starts a browser download; the suggested
    filename ends with ".csv", and the downloaded UTF-8 text is the exported CSV. The exported CSV preserves
    empty cells within the used range according to the grid’s actual row and column order and correctly
    escapes text containing commas, quotes, or line breaks. Ordinary cells export their displayed values;
