- id: REQ-2-1-1
  name: Add a Worksheet
  type: ATOMIC
  dependencies:
  - REQ-1-1-1
  - REQ-2-1-3
  description: 'Users add a worksheet using the button with the accessible name "Add worksheet" in the
    tab bar of the workbook editor page. The new tab uses the first unused SheetN name in positive-integer
    order; when only Sheet1 exists, Sheet2 is created. The new worksheet is blank and does not inherit
    filters, validation, or pivot results from other worksheets; after creation it becomes the active
    tab and A1 is selected. Existing worksheets and their data remain unchanged. The new tab still exists
    after refresh or reopening. If addition fails, an error is shown, no new tab appears, and existing
    worksheets remain unchanged.

    '
  scenarios:
  - name: REQ-2-1-1 -the requested workflow Sheet2,the requested workflow
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh unauthenticated browser session.
        The evaluation seed contains the seeded workbook `Q3 Sales` with `Sheet1` and `Sheet2`, rows `East/1200`
        and `North/800`.
    - keyword: WHEN
      content: The user opens the workbook home page, clicks the visible `Q3 Sales` workbook entry, and
        the requested workflow sheet2,the requested workflow with concrete values `East`, `1200`, `North`,
        and `800`. Every value is entered through a visible, labelled control; no implementation-specific
        navigation, API, database id, or internal implementation detail is assumed.
    - keyword: THEN
      content: The application exposes the observable result for "the requested workflow Sheet2,the requested
        workflow" using the same seeded names and values (the seeded workbook `Q3 Sales` with `Sheet1`
        and `Sheet2`, rows `East/1200` and `North/800`); validation or permission failures are shown beside
        the named control and do not create a partial record.
    - keyword: THEN
      content: After the user refreshes the page or reopens the visible destination from the application
        entry point, the successful result and workbook `Q3 Sales`, worksheets `Sheet1` and `Sheet2`,
        rows `East/1200` and `North/800` remain persisted; on failure, the original seeded state remains
        unchanged.
  - name: REQ-2-1-1 -the requested workflow SheetN the requested workflow
