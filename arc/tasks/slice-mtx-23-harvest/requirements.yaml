id: ROOT
name: Core Requirements for an Online Spreadsheet Data Workspace
type: FOLDER
dependencies: []
description: '[通宵草案 arch-22 全绿时用：全树-mtx-22 补集 13 节点/44 场景，与 22 合计覆盖 24 原子；T2 前本地合龙验证] A streamlined online
  spreadsheet application with an interface modeled after Google Sheets, covering workbook and worksheet
  management, spreadsheet data editing, formula calculation, sorting and filtering, data validation, and
  basic pivot analysis. Sharing and collaboration, version-history restoration, advanced visual styling,
  charts, macros, real-time collaborative cursors, and integrations with'
children:
- id: REQ-1-1-1
  name: View and Open a Workbook
  type: ATOMIC
  dependencies: []
  description: 'Users view available workbooks on the workbook home page. Each record displays "Last updated:
    <last updated value>" and provides a link whose accessible name is the workbook name. After the user
    clicks the link, the editor displays the same "Last updated: <last updated value>", the corresponding
    workbook name, worksheet tabs and order, current active worksheet, row and column structure, grid
    values, formula bar content, filter views, validation entry points, and pivot table results; data
    from another workbook must not appear in the current grid. The current editor page entry in the browser
    must be directly accessible and continue to identify the same workbook after refresh; visiting that
    exact workbook state in the same or a later browser session must restore the workbook’s most recent
    successful state without requiring navigation through the home page. The entry format is implementation-defined.


    Page reference:

    ![image](reference/workbook-home.png)

    '
  scenarios:
  - name: REQ-1-1-1 -the requested workflow,the requested workflow page entry the requested workflow
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh unauthenticated browser session.
        The evaluation seed contains the seeded workbook `Q3 Sales`, worksheet `Sheet1`, and cell A1 value
        `Region`.
    - keyword: WHEN
      content: The user opens the workbook home page, clicks the visible `Q3 Sales` workbook entry, and
        the requested workflow,the requested workflow page entry the requested workflow with concrete
        values `East`, `1200`, `North`, and `800`. Every value is entered through a visible, labelled
        control; no implementation-specific navigation, API, database id, or internal implementation detail
        is assumed.
    - keyword: THEN
      content: The application exposes the observable result for "the requested workflow,the requested
        workflow page entry the requested workflow" using the same seeded names and values (the seeded
        workbook `Q3 Sales`, worksheet `Sheet1`, and cell A1 value `Region`); validation or permission
        failures are shown beside the named control and do not create a partial record.
    - keyword: THEN
      content: After the user refreshes the page or reopens the visible destination from the application
        entry point, the successful result and workbook `Q3 Sales`, worksheet `Sheet1`, cell `A1=Region`
        remain persisted; on failure, the original seeded state remains unchanged.
  - name: REQ-1-1-1 -the requested workflow
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh unauthenticated browser session.
        The evaluation seed contains the seeded workbook `Q3 Sales`, worksheet `Sheet1`, and cell A1 value
        `Region`.
    - keyword: WHEN
      content: The user opens the workbook home page, clicks the visible `Q3 Sales` workbook entry, and
        the requested workflow with concrete values `East`, `1200`, `North`, and `800`. Every value is
        entered through a visible, labelled control; no implementation-specific navigation, API, database
        id, or internal implementation detail is assumed.
    - keyword: THEN
      content: The application exposes the observable result for "the requested workflow" using the same
        seeded names and values (the seeded workbook `Q3 Sales`, worksheet `Sheet1`, and cell A1 value
        `Region`); validation or permission failures are shown beside the named control and do not create
        a partial record.
    - keyword: THEN
      content: After the user refreshes the page or reopens the visible destination from the application
        entry point, the successful result and workbook `Q3 Sales`, worksheet `Sheet1`, cell `A1=Region`
        remain persisted; on failure, the original seeded state remains unchanged.
- id: REQ-1-2-1
  name: Create a Blank Workbook
  type: ATOMIC
  dependencies: []
  description: 'Users create a blank workbook from the workbook home page. The home page provides a button
    with the accessible name "New blank workbook"; clicking it opens the creation page, whose submit button
    is named "Create". After creation succeeds, the editor opens and shows only a blank worksheet named
    Sheet1, with Sheet1 active and A1 selected; refreshing or returning to the home page and reopening
    produces the same state. If creation fails, an error is displayed, the user remains in a retryable
    state, and no incomplete workbook record may appear on the home page.


    Page reference:

    ![image](reference/create-workbook.png)

    '
  scenarios:
  - name: REQ-1-2-1 -the requested workflow,the requested workflow Sheet1 the requested workflow A1 the
      requested workflow
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh unauthenticated browser session.
        The evaluation seed contains the seeded workbook `Q3 Sales`, worksheet `Sheet1`, and cell A1 value
        `Region`.
    - keyword: WHEN
      content: The user opens the workbook home page, clicks the visible `Q3 Sales` workbook entry, and
        the requested workflow,the requested workflow sheet1 the requested workflow a1 the requested workflow
        with concrete values `East`, `1200`, `North`, and `800`. Every value is entered through a visible,
        labelled control; no implementation-specific navigation, API, database id, or internal implementation
        detail is assumed.
    - keyword: THEN
      content: The application exposes the observable result for "the requested workflow,the requested
        workflow Sheet1 the requested workflow A1 the requested workflow" using the same seeded names
        and values (the seeded workbook `Q3 Sales`, worksheet `Sheet1`, and cell A1 value `Region`); validation
        or permission failures are shown beside the named control and do not create a partial record.
    - keyword: THEN
      content: After the user refreshes the page or reopens the visible destination from the application
        entry point, the successful result and workbook `Q3 Sales`, worksheet `Sheet1`, cell `A1=Region`
        remain persisted; on failure, the original seeded state remains unchanged.
